# MIZIGO — live-site smoke test (https://mizigo.netlify.app).
#
# Production monitoring for the public deployment: hits the public endpoints
# every 30 minutes and fails loudly if the site, API, seeded marketplace or
# legal pages go down. Zero secrets needed — it tests exactly what a real
# user's browser sees.

name: live-smoke

on:
  schedule:
    # every 30 minutes (UTC) — :05/:35 avoids the top-of-hour cron crowd
    - cron: "5,35 * * * *"
  workflow_dispatch:

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: mizigo.netlify.app health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe the live site
        run: |
          BASE="https://mizigo.netlify.app"
          fail=0

          probe() { # name, path, expect substring
            local name="$1" path="$2" expect="$3"
            local body code
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 30 "$BASE$path")
            body=$(cat /tmp/body)
            if [ "$code" != "200" ]; then
              echo "::error title=$name::$path returned HTTP $code"
              fail=1
            elif [ -n "$expect" ] && ! echo "$body" | grep -q "$expect"; then
              echo "::error title=$name::$path response missing '$expect'"
              fail=1
            else
              echo "OK  $name ($path)"
            fi
          }

          probe "site"           "/"                      "Mizigo"
          probe "bootstrap API"  "/api/bootstrap"         "categories"
          probe "locations API"  "/api/locations"         "places"
          probe "privacy page"   "/privacy"               "Privacy"
          probe "terms page"     "/terms"                 "Terms"
          probe "refund page"    "/refund"                 "Refund"
          probe "unknown track"  "/api/track/nonexistent" "not found"

          # unknown-track returning 404 is correct — probe() only asserts 200,
          # so check it manually
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE/api/track/nonexistent-token-xyz")
          if [ "$code" != "404" ]; then
            echo "::error title=track-404::expected 404 for unknown token, got $code"
            fail=1
          else
            echo "OK  unknown tracking token → 404"
          fi

          exit $fail

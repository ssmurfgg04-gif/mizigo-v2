# MIZIGO — Netlify deployment
# Connect the repo at https://app.netlify.com (New site from Git) and it picks
# this file up automatically.
#
# Two modes (see docs/NETLIFY_PRODUCTION.md):
#   DATABASE_URL unset        → sandbox: per-instance /tmp SQLite, self-bootstraps
#                               schema + demo seed on cold start (single-user demo)
#   DATABASE_URL=postgresql://→ production: hosted Postgres (Neon/Supabase);
#                               db-prepare pushes the schema at build time
#
# build:netlify runs scripts/patch_netlify_cache.mjs before next build, which
# replaces the Next runtime's Blobs-backed cache handler with a no-op one: the
# original throws MissingBlobsEnvironmentError on sites without the injected
# Blobs context and 500s every API route. MIZIGO uses no ISR/fetch caching, so
# the no-op handler is functionally identical and platform-proof.

[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # let Netlify's Next runtime own the build output
  NEXT_TELEMETRY_DISABLED = "true"

# Netlify's Next.js runtime (App Router, route handlers → functions)
[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # keep the Prisma query engines (multi-platform) inside the function bundle
  included_files = [
    "node_modules/.prisma/**/*",
    "node_modules/@prisma/client/**/*",
    "node_modules/prisma/libquery_engine*/*",
    "node_modules/@prisma/engines/*"
  ]
  node_bundler = "esbuild"

[[headers]]
  for = "/api/*"
  [headers.values]
  Cache-Control = "no-store"

# baseline security headers (mirrored from next.config.ts)
[[headers]]
  for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://basemaps.cartocdn.com https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://basemaps.cartocdn.com; worker-src 'self' blob:; child-src 'self' blob:; form-action 'self'; base-uri 'self'; frame-ancestors 'none'"

<?xml version="1.0" encoding="utf-8"?>
<!-- MIZIGO route-M mark: an M drawn as a delivery route with an orange
     waypoint dot at the valley — cargo picked up, cargo delivered. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect x="1" y="1" width="30" height="30" rx="9" fill="#17181C"/>
  <g stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M8.5 22.7 L8.5 9.3 L13.3 16"/>
    <path d="M18.7 16 L23.5 9.3 L23.5 22.7"/>
  </g>
  <circle cx="16" cy="18.2" r="2.9" fill="#E8590C"/>
</svg>
